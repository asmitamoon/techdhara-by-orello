apiVersion: v1
kind: Secret
metadata:
  name: {{ include "innovation-guild.fullname" . }}-secrets
  labels:
    {{- include "innovation-guild.labels" . | nindent 4 }}
type: Opaque
data:
  jwt-access-secret: {{ .Values.global.jwtAccessSecret | b64enc | quote }}
  jwt-refresh-secret: {{ .Values.global.jwtRefreshSecret | b64enc | quote }}
  minio-root-password: {{ .Values.minio.rootPassword | b64enc | quote }}
