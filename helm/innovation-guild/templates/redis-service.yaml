{{- if .Values.redis.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "innovation-guild.fullname" . }}-redis
  labels:
    {{- include "innovation-guild.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  ports:
    - port: {{ .Values.redis.port }}
      targetPort: redis
      name: redis
  selector:
    {{- include "innovation-guild.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: redis
{{- end }}
